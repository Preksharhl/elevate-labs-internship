apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: cicd-demo}
  template:
    metadata:
      labels: {app: cicd-demo}
    spec:
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USERNAME/cicd-demo:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
