{% extends "base.html" %}{% block body %}
<div class="card shadow-sm col-md-8 mx-auto"><div class="card-body p-4"><h4 class="mb-3">Report an incident</h4>
<form method="post">
<label class="form-label">Title</label><input class="form-control mb-3" name="title" required>
<label class="form-label">Description</label><textarea class="form-control mb-3" name="description" rows="5"></textarea>
<div class="row mb-3"><div class="col"><label class="form-label">Severity</label><select class="form-select" name="severity">
{% for s in SEVERITIES %}<option {{'selected' if s=='medium'}}>{{s}}</option>{% endfor %}</select></div>
<div class="col"><label class="form-label">Category</label><select class="form-select" name="category">
{% for c in CATEGORIES %}<option>{{c}}</option>{% endfor %}</select></div></div>
<button class="btn btn-primary">Submit</button> <a class="btn btn-link" href="/">Cancel</a></form></div></div>{% endblock %}
