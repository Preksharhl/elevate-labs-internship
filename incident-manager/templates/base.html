<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Incident Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:#f4f6fb}.navbar{background:#1e2a4a}
.stat{border:0;border-left:5px solid;border-radius:10px}
.sev-critical{background:#dc3545}.sev-high{background:#fd7e14}.sev-medium{background:#0d6efd}.sev-low{background:#6c757d}
.st-open{background:#dc3545}.st-investigating{background:#ffc107;color:#000}.st-resolved{background:#198754}
.tl{border-left:3px solid #dee2e6;padding-left:14px;margin-bottom:14px}.tl.ev{border-color:#0d6efd}
</style></head><body>
<nav class="navbar navbar-dark mb-4"><div class="container">
<a class="navbar-brand fw-bold" href="/"><i class="bi bi-shield-exclamation"></i> Incident Manager</a>
{% if me %}<div class="d-flex align-items-center gap-3 text-white">
<a class="btn btn-sm btn-warning" href="/incidents/new"><i class="bi bi-plus-lg"></i> Report</a>
{% if me.role=='admin' %}<a class="text-white-50 text-decoration-none" href="/admin/users">Users</a>{% endif %}
<span class="small"><i class="bi bi-person-circle"></i> {{me.username}} <span class="badge bg-secondary">{{me.role}}</span></span>
<a class="text-white-50" href="/logout"><i class="bi bi-box-arrow-right"></i></a></div>{% endif %}
</div></nav>
<div class="container pb-5">
{% for c,m in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}
{% block body %}{% endblock %}</div></body></html>
