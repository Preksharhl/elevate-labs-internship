name: CI/CD - Project 4

on:
  push:
    branches: [main]
    paths: ["04-cicd-pipeline/**", ".github/workflows/cicd-04.yml"]
  pull_request:
    paths: ["04-cicd-pipeline/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: 04-cicd-pipeline

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 04-cicd-pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8 app tests --max-line-length=120
      - run: pytest -v

  build-and-push:
    name: Build and push Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: 04-cicd-pipeline
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo:${{ github.sha }}
